name: Build Themerr add-on image

on:
  workflow_dispatch:
  push:
    paths:
      - "themerr/**"
      - ".github/workflows/build-themerr.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read add-on and upstream versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          ADDON_VERSION="$(grep '^version:' themerr/config.yaml | sed -E 's/version: *"([^"]+)"/\1/')"
          UPSTREAM_TAG="$(curl -fsSL 'https://hub.docker.com/v2/repositories/lizardbyte/themerr/tags?page_size=100&ordering=last_updated' |
            jq -r '.results[].name' |
            grep -E '^v[0-9]{4}\.[0-9]{4}\.[0-9]+$' |
            sort -V | tail -n1)"
          test -n "$ADDON_VERSION"
          test -n "$UPSTREAM_TAG"
          echo "addon_version=$ADDON_VERSION" >> "$GITHUB_OUTPUT"
          echo "upstream_tag=$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push amd64
        uses: docker/build-push-action@v6
        with:
          context: ./themerr
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/peeett87/ha-addon-themerr-amd64:latest
            ghcr.io/peeett87/ha-addon-themerr-amd64:${{ steps.versions.outputs.addon_version }}
          build-args: |
            THEMERR_IMAGE=lizardbyte/themerr:${{ steps.versions.outputs.upstream_tag }}

      - name: Build and push aarch64
        uses: docker/build-push-action@v6
        with:
          context: ./themerr
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/peeett87/ha-addon-themerr-aarch64:latest
            ghcr.io/peeett87/ha-addon-themerr-aarch64:${{ steps.versions.outputs.addon_version }}
          build-args: |
            THEMERR_IMAGE=lizardbyte/themerr:${{ steps.versions.outputs.upstream_tag }}
