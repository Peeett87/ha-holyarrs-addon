name: Update Themerr add-on

on:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find latest stable upstream tag
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          TAG="$(curl -fsSL 'https://hub.docker.com/v2/repositories/lizardbyte/themerr/tags?page_size=100&ordering=last_updated' |
            jq -r '.results[].name' |
            grep -E '^v[0-9]{4}\.[0-9]{4}\.[0-9]+$' |
            sort -V |
            tail -n1)"
          test -n "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Update add-on version when upstream changes
        id: version
        shell: bash
        run: |
          set -euo pipefail
          CURRENT="$(yq -r '.version' themerr/config.yaml)"
          UPSTREAM="${{ steps.upstream.outputs.version }}"
          if [ "$CURRENT" != "$UPSTREAM" ]; then
            yq -i ".version = \"$UPSTREAM\"" themerr/config.yaml
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: steps.version.outputs.changed == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        if: steps.version.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.version.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push amd64
        if: steps.version.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./themerr
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ha-addon-themerr-amd64:${{ steps.upstream.outputs.version }}
          build-args: |
            THEMERR_IMAGE=lizardbyte/themerr:${{ steps.upstream.outputs.tag }}

      - name: Build and push aarch64
        if: steps.version.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./themerr
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ha-addon-themerr-aarch64:${{ steps.upstream.outputs.version }}
          build-args: |
            THEMERR_IMAGE=lizardbyte/themerr:${{ steps.upstream.outputs.tag }}

      - name: Commit add-on version update
        if: steps.version.outputs.changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(themerr): update to ${{ steps.upstream.outputs.tag }}"
          file_pattern: themerr/config.yaml
