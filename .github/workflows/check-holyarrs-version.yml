name: Check HolyArrs Docker tags

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find newest stable Docker Hub tag
        id: tags
        run: |
          curl -fsSL \
            "https://hub.docker.com/v2/repositories/holyarrs/holyarrs/tags?page_size=100" \
            -o tags.json

          VERSION=$(python3 -c '
          import json,re
          data=json.load(open("tags.json"))
          versions=[]
          for item in data["results"]:
              tag=item["name"]
              if re.fullmatch(r"\d+\.\d+\.\d+",tag):
                  versions.append(tuple(map(int,tag.split("."))))
          print(".".join(map(str,max(versions))))
          ')

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update version
        env:
          NEW_VERSION: ${{ steps.tags.outputs.version }}
        run: |
          python3 - <<'PY'
          import os,re
          from pathlib import Path

          p=Path("holyarrs/config.yaml")
          text=p.read_text()
          m=re.search(r'(?m)^version:\s*["\']?([0-9.]+)',text)

          if not m:
              raise SystemExit("Version niet gevonden")

          old=tuple(map(int,m.group(1).split(".")))
          new=os.environ["NEW_VERSION"]

          if tuple(map(int,new.split("."))) > old:
              text=text[:m.start(1)]+new+text[m.end(1):]
              p.write_text(text)
              print("Nieuwe versie:",new)
          else:
              print("Geen update nodig")
          PY

      - name: Commit update
        run: |
          if git diff --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add holyarrs/config.yaml
          git commit -m "Update HolyArrs version"
          git push
