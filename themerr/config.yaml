name: Themerr
version: "2026.1121.140403"
slug: themerr
description: Standalone theme song manager for Jellyfin using ThemerrDB.
url: https://github.com/Themerr/Themerr
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
map:
  - type: addon_config
    read_only: false
    path: /config
  - type: ssl
    read_only: true
ports:
  9494/tcp: 9494
  9495/tcp: 9495
ports_description:
  9494/tcp: Themerr web interface (HTTPS)
  9495/tcp: Jellyfin connector repository (HTTP)
image: ghcr.io/peeett87/ha-addon-themerr-{arch}
